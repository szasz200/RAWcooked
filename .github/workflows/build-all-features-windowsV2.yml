            automake
            libtool
            make
            git
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Print toolchain diagnostics
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo 'Compiler / build tools:'
            command -v gcc g++ make python3 || true
            g++ --version | head -n 1
            make --version | head -n 1
            python3 --version
            echo 'Repo revision:'
            git rev-parse HEAD
            echo 'Relevant source directories:'
            ls -ld Project/GNU/CLI Source/Lib/License
          } 2>&1 | tee logs/environment.txt

      - name: Allow all flavors through IsSupported (experimental only)
        if: matrix.variant == 'all-implemented'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('Source/Lib/License')
          if not root.is_dir():
              raise SystemExit(f'Missing license source folder: {root}')
          files = [p for p in root.rglob('*') if p.suffix in ('.cpp', '.h', '.hpp')]
          regex = re.compile(
              r'(?m)^[ \t]*(?:inline[ \t]+)?bool[ \t]+'
              r'(?:[A-Za-z_]\w*::)*IsSupported[ \t]*'
              r'\([^;{}]*\)\s*(?:const\s*)?(?:noexcept\s*)?\{'
          )
          matches = []
          for path in files:
              content = path.read_text(encoding='utf-8-sig')
              for match in regex.finditer(content):
                  matches.append((path, content, match))
          if len(matches) != 1:
              for path in files:
                  for number, line in enumerate(path.read_text(encoding='utf-8-sig').splitlines(), 1):
                      if 'IsSupported' in line:
                          print(f'{path}:{number}: {line.strip()}')
              raise SystemExit(f'Expected one IsSupported() definition, found {len(matches)}')
          path, content, match = matches[0]
          addition = ('\n    // EXPERIMENTAL BUILD: bypass flavor-level license gate.\n'
                      '    return true;\n')
          path.write_text(content[:match.end()] + addition + content[match.end():],
                          encoding='utf-8', newline='')
          print(f'Patched {path}: {match.group(0).strip()}')
          PY
          git diff --check
          git diff -- Source/Lib/License | tee logs/license-patch.diff

      - name: Generate build files and compile
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd Project/GNU/CLI
          bash autogen.sh 2>&1 | tee ../../../logs/autogen.log
          LIBS='-lshell32 -lws2_32' \
          CXXFLAGS='-O2 -std=gnu++17' \
          LDFLAGS='-static-libgcc -static-libstdc++' \
          ./configure 2>&1 | tee ../../../logs/configure.log
          # tee must not hide the actual exit status of make.
          make -j2 V=1 2>&1 | tee ../../../logs/make.log
          # If the name or location changes upstream, show the discovered exes.
          find . -iname 'rawcooked.exe' -print | tee ../../../logs/executables.txt
          test -s rawcooked.exe
          ./rawcooked.exe --version > ../../../logs/version.txt 2>&1 || true
          ./rawcooked.exe --show-license > ../../../logs/license-report.txt 2>&1 || true

      - name: Package Windows EXE
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp Project/GNU/CLI/rawcooked.exe dist/
          cp LICENSE dist/UPSTREAM-LICENSE.txt
          cp logs/license-report.txt dist/ || true
          cat > dist/README.txt <<'TXT'
          Independent experimental RAWcooked Windows x64 build.
          Variant: ${{ matrix.variant }}
          This is NOT an official MediaArea binary.
          The all-implemented variant skips the source license gate;
          it does not implement missing codecs or guarantee decoding.
          Use only test files and verify reversibility.
          FFmpeg must also be available: https://ffmpeg.org/download.html
          TXT
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if test -f "/ucrt64/bin/$dll"; then cp "/ucrt64/bin/$dll" dist/; fi
          done
          objdump -p dist/rawcooked.exe | grep 'DLL Name:' > dist/dependencies.txt || true
          ls -lh dist

      - name: Upload EXE (when built successfully)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rawcooked-windows-x64-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Always upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawcooked-logs-${{ matrix.variant }}
          path: |
            logs/
            Project/GNU/CLI/config.log
          if-no-files-found: warn
          retention-days: 14
